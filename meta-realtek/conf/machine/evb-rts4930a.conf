KERNEL_DEVICETREE = "realtek/rts4930a-evb.dtb"
UBOOT_MACHINE = "uboot_2023.01_4930a_defconfig"

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

OBMC_COMPATIBLE_NAMES = "com.realtek.Hardware.BMC.Model.rts4930a"

require conf/machine/include/realtek-rts493xa.inc

# RTS4930A EVB flash size
FLASH_SIZE ?= "131072"

# Fixed partition offsets
FLASH_UBOOT_OFFSET ?= "0"
FLASH_MANIFEST_OFFSET ?= "380"
FLASH_MANIFEST_OFFSET:flash-131072 ?= "888"
FLASH_UBOOT_ENV_OFFSET ?= "768"
FLASH_KERNEL_OFFSET ?= "1024"
FLASH_ROFS_OFFSET ?= "5376"
FLASH_RWFS_OFFSET ?= "98560"
